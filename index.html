<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>Einstein e Chaplin — paralaxe</title><style>
*{box-sizing:border-box}body{margin:0;background:#101017;color:#efebe3;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:14px}h1{font-size:18px;font-weight:550;text-align:center}.stage{width:min(100%,1300px);aspect-ratio:1536/658;position:relative;overflow:hidden;background:#30251b;border-radius:10px;touch-action:none;--x:0px;--y:0px;box-shadow:0 15px 50px #0006}.layer{position:absolute;inset:-3%;width:106%;height:106%;object-fit:fill;pointer-events:none;user-select:none}.back{transform:translate(calc(var(--x)* -0.55),calc(var(--y)* -0.55)) scale(1.015)}.front{transform:translate(var(--x),var(--y)) scale(1.015)}button{border:0;border-radius:11px;padding:12px 17px;font:inherit;font-weight:600;background:#e9ddbd;color:#241f1a}button.secondary{background:#35353a;color:#eee}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.hint,.status{font-size:14px;color:#c4bdb1;text-align:center;max-width:540px;line-height:1.5}.status{font-size:12px}@media(max-width:650px){.stage{aspect-ratio:1.45}.layer{width:auto;min-width:106%;height:106%;left:50%;transform-origin:center center}.back{transform:translate(calc(-50% - var(--x)* .55),calc(var(--y)* -.55)) scale(1.015)}.front{transform:translate(calc(-50% + var(--x)),var(--y)) scale(1.015)}}
</style></head><body><h1>Einstein e Chaplin — profundidade interativa</h1><div class="stage" id="stage"><img class="layer back" draggable="false" src="fundo.jpg"/><img class="layer front" draggable="false" src="personagens.png"/></div><div class="hint">Deslize o dedo sobre a fotografia para mudar a perspectiva. Para usar a inclinação do iPhone, toque em <b>Ativar movimento</b>.</div><div class="buttons"><button id="enable">Ativar movimento</button><button class="secondary" id="reset">Centralizar</button></div><div class="status" id="status">Fotografia integrada ao arquivo. Funciona também sem WebGL.</div><script>
const stage=document.getElementById('stage'),status=document.getElementById('status');let x=0,y=0,tx=0,ty=0,base=null,active=false;
function step(){x+=(tx-x)*.12;y+=(ty-y)*.12;stage.style.setProperty('--x',x.toFixed(2)+'px');stage.style.setProperty('--y',y.toFixed(2)+'px');requestAnimationFrame(step)}step();
function pointer(e){let r=stage.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*26;ty=((e.clientY-r.top)/r.height-.5)*18}
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);active=false;pointer(e)});stage.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});document.getElementById('reset').onclick=()=>{tx=ty=0;base=null};
document.getElementById('enable').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined'){status.textContent='Sensor não disponível. Arraste a imagem com o dedo.';return}if(typeof DeviceOrientationEvent.requestPermission==='function'){let p=await DeviceOrientationEvent.requestPermission();if(p!=='granted'){status.textContent='Permissão não concedida. Use o dedo.';return}}active=true;base=null;window.addEventListener('deviceorientation',e=>{if(!active||e.gamma==null||e.beta==null)return;if(!base)base={g:e.gamma,b:e.beta};tx=Math.max(-15,Math.min(15,(e.gamma-base.g)*.7));ty=Math.max(-10,Math.min(10,(e.beta-base.b)*.6));});status.textContent='Incline o telefone. Se a visualização do arquivo bloquear o sensor, abra no Safari.'}catch(e){status.textContent='O visualizador não permitiu sensores. Arraste a foto com o dedo.'}};
</script></body></html>
